modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="openpartiesandclaims"
    mandatory=true
    versionRange="${opac_version_range}"
    ordering="AFTER"
    side="SERVER"

[[dependencies.${mod_id}]]
    modId="bluemap"
    mandatory=true
    versionRange="${bluemap_version_range}"
    ordering="AFTER"
    side="SERVER"

# Optional: Discord login and player panel on the BlueMap web
[[dependencies.${mod_id}]]
    modId="kb_discord_auth"
    mandatory=false
    versionRange="[1.6,)"
    ordering="NONE"
    side="SERVER"
